<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CDM Asset Review</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">CDM Asset Review <span class="tag">sandbox</span></div>
    <!-- Top tab bar (asset classes) — governance toggle style -->
    <nav id="asset-tabs" class="asset-tabs"></nav>
    <span id="status" class="status"></span>
  </header>

  <div class="layout">
    <!-- Left-hand list of all records in the active tab -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-title-row">
          <div id="sidebar-title" class="sidebar-title">Records</div>
          <button id="add-record" class="add-btn hidden" title="Add a new record to the sandbox">+ Add</button>
        </div>
        <input id="search" type="search" placeholder="Filter…" />
        <div id="count" class="count"></div>
      </div>
      <ul id="item-list" class="property-list"></ul>
    </aside>

    <!-- Main summary dashboard -->
    <main class="content">
      <div class="content-head">
        <h1 id="content-title">Portfolio</h1>
        <p id="content-sub">Common Domain Model — sandbox copy. Select a record's review icon to inspect its full CDM record.</p>
      </div>
      <div id="cards" class="cards"></div>
      <div class="hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Click the review icon on any record to open its detailed CDM data.
      </div>
    </main>
  </div>

  <!-- Detail modal (governance style) — populated by JS -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <div class="modal-head">
        <span id="modal-title" class="modal-title">Detail</span>
        <div class="modal-head-actions">
          <button id="modal-expand" class="icon-btn expand" title="Expand">&#x26F6;</button>
          <button id="modal-close" class="icon-btn close" title="Close">&times;</button>
        </div>
      </div>
      <div id="detail-card" class="detail-card"></div>
      <nav id="detail-tabs" class="detail-tabs"></nav>
      <div id="detail-body" class="detail-body"></div>
      <div id="modal-foot" class="modal-foot"></div>
    </div>
  </div>

  <!-- PRS Waterfall tab reuses the main app's renderer (shared, not duplicated). -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/shared/phc_basis_waterfall.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
