[project]
name = "mkm-modelrisk"
version = "0.1.0"
description = "MKM-ModelRisk — generic, model-agnostic model-risk-governance platform (event-sourced, Postgres-backed)."
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "psycopg[binary]>=3.2",
    "flask>=3.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "playwright>=1.49",
    "pytest-playwright>=0.6",
]

[tool.setuptools.packages.find]
include = ["config*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not e2e and not journey'"
markers = [
    "e2e: end-to-end browser tests against a live server (run with: pytest tests/e2e -m e2e)",
    "journey: end-to-end onboarding journey on a dedicated DB (run with: TEST_DB_BASE=mkm_modelrisk_journey pytest tests/journey -m journey)",
]

[tool.coverage.run]
# ctrace avoids the Python 3.13.x sys.monitoring tracer deflation bug that
# otherwise makes coverage under-report (see PhysicalRisk coding rule R3).
core = "ctrace"
branch = true
source = ["config", "src"]

[tool.coverage.report]
# Coding rule R3: >=99% coverage, verified each stage.
fail_under = 99
show_missing = true
